name: Set up NIDAP environment
description: Restore the isolated CI tools and verify the requested environment.
inputs:
  mode:
    description: Preflight mode for the consuming job.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: NIDAP-ci-tools
        path: ${{ runner.temp }}/NIDAP-ci-tools

    - name: Restore isolated CI tools
      shell: bash
      run: |
        tar -xzf "$RUNNER_TEMP/NIDAP-ci-tools/library.tar.gz" -C "$RUNNER_TEMP/NIDAP-ci-tools"
        printf 'R_LIBS_USER=%s/library\n' "$RUNNER_TEMP/NIDAP-ci-tools" >> "$GITHUB_ENV"
        printf 'R_LIBS=%s/library%s\n' "$RUNNER_TEMP/NIDAP-ci-tools" "${R_LIBS:+:$R_LIBS}" >> "$GITHUB_ENV"

    - name: Verify NIDAP environment
      shell: bash
      env:
        NIDAP_PREFLIGHT_MODE: ${{ inputs.mode }}
      run: Rscript .github/scripts/ci-preflight.R "$NIDAP_PREFLIGHT_MODE"

    - name: Restore pinned fixture archive cache
      if: inputs.mode != 'lint'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/SCWorkflow-fixtures
        key: ${{ runner.os }}-SCWorkflow-fixtures-${{ hashFiles('tests/fixture-bundle.json') }}

    - name: Download and verify pinned test fixtures
      if: inputs.mode != 'lint'
      shell: bash
      run: |
        printf 'SCWORKFLOW_FIXTURE_CACHE=%s/SCWorkflow-fixtures\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
        SCWORKFLOW_FIXTURE_CACHE="$RUNNER_TEMP/SCWorkflow-fixtures" \
          Rscript tests/setup-fixtures.R --download-only
