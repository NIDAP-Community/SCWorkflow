# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev, DEV]
  pull_request:
    branches: [main, master, dev, DEV]

name: test-coverage

permissions: read-all

jobs:
  prepare-environment:
    uses: ./.github/workflows/frozen-environment.yaml

  test-coverage:
    needs: prepare-environment
    runs-on: ubuntu-latest
    container:
      image: rfinney/rs413s@sha256:7cb32eaac452ad32abb34e9a9e3edb42590e4dfcf696caeb72bb375a5b3c83cf
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frozen-ci-tools
          path: ${{ runner.temp }}/frozen-ci-tools

      - name: Restore isolated CI tools
        run: |
          tar -xzf "${{ runner.temp }}/frozen-ci-tools/library.tar.gz" -C "${{ runner.temp }}/frozen-ci-tools"
          printf 'R_LIBS_USER=%s/library\n' "${{ runner.temp }}/frozen-ci-tools" >> "$GITHUB_ENV"

      - name: Verify frozen coverage environment
        run: Rscript .github/scripts/ci-preflight.R coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' && true || false }}
          file: ./cobertura.xml
          plugin: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

      - name: Upload frozen coverage environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-coverage-environment
          path: ci-artifacts/
