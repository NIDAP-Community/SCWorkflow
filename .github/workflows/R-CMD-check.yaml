# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [ main, master, dev, DEV ]
  pull_request:
    branches: [ main, master, dev, DEV ]
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read
  pull-requests: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    name: Frozen container check
    container:
      image: nciccbr/scworkflow@sha256:1bf587adfb1f4703e1e653ee1628dfeb93937fc16a2cc706aa47064a6a710b6a
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen check environment
        run: Rscript .github/scripts/ci-preflight.R check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true

      - name: Upload frozen check environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-check-environment
          path: ci-artifacts/

  lint:
    runs-on: ubuntu-latest
    container:
      image: nciccbr/scworkflow@sha256:1bf587adfb1f4703e1e653ee1628dfeb93937fc16a2cc706aa47064a6a710b6a
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen lint environment
        run: Rscript .github/scripts/ci-preflight.R lint

      - name: Good Practice checks
        shell: Rscript {0}
        run: |
          g <- goodpractice::gp()
          g
          n_failed <- length(goodpractice::failed_checks(g))
          if (n_failed > 0) {
            warning(paste(n_failed, "failed checks"))
          }
      - name: Lint
        shell: Rscript {0}
        run: lintr::lint_package()
        env:
          LINTR_ERROR_ON_LINT: false

      - name: Upload frozen lint environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-lint-environment
          path: ci-artifacts/

  test-coverage:
    runs-on: ubuntu-latest
    container:
      image: nciccbr/scworkflow@sha256:1bf587adfb1f4703e1e653ee1628dfeb93937fc16a2cc706aa47064a6a710b6a
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen coverage environment
        run: Rscript .github/scripts/ci-preflight.R coverage
      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}
      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' && true || false }}
          file: ./cobertura.xml
          plugin: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

      - name: Upload frozen coverage environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-coverage-environment
          path: ci-artifacts/

  check:
    # make sure all check jobs pass. https://github.com/orgs/community/discussions/4324#discussioncomment-3477871
    runs-on: ubuntu-latest
    needs: [ R-CMD-check, lint, test-coverage ]
    if: always()
    steps:
      - name: Require all validation jobs to succeed
        run: |
          [[ "${{ needs['R-CMD-check'].result }}" == "success" ]]
          [[ "${{ needs.lint.result }}" == "success" ]]
          [[ "${{ needs.test-coverage.result }}" == "success" ]]
