name: Gitflow Action for R Package Development
run-name: ${{ github.actor }} now ${{ github.event_name }} to ${{ github.ref_name }}

on:
  push:
    branches: ['*', '!dev', '!main', '!release_dev', '!Conda_Package', '!github_page']
    
  pull_request:
    types: ['opened', 'closed']
    branches: ['main', 'release*']

jobs:
  prepare-environment:
    if: github.event_name == 'push' || github.event.pull_request.merged != true
    uses: ./.github/workflows/NIDAP-environment.yaml

  NIDAP-validation:
    name: NIDAP Gitflow checks
    needs: prepare-environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: rfinney/rs413s@sha256:7cb32eaac452ad32abb34e9a9e3edb42590e4dfcf696caeb72bb375a5b3c83cf
    env:
      GITFLOW_EVENT: ${{ github.event_name }}
      GITFLOW_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      GITFLOW_BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: NIDAP-ci-tools
          path: ${{ runner.temp }}/NIDAP-ci-tools

      - name: Restore isolated CI tools
        run: |
          tar -xzf "$RUNNER_TEMP/NIDAP-ci-tools/library.tar.gz" -C "$RUNNER_TEMP/NIDAP-ci-tools"
          printf 'R_LIBS_USER=%s/library\n' "$RUNNER_TEMP/NIDAP-ci-tools" >> "$GITHUB_ENV"

      - name: Verify NIDAP Gitflow environment
        run: Rscript .github/scripts/ci-preflight.R check

      - name: Run Gitflow validation
        run: Rscript .github/scripts/ci-gitflow-check.R

      - name: Upload NIDAP Gitflow environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NIDAP-gitflow-environment
          path: ci-artifacts/

  Activating_Parser:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    uses: fnlcr-bids-sdsi/gitflow-R/.github/workflows/parser.yml@master
    with:
      image_to_use: ghcr.io/nidap-community/single-cell-rna-r4:latest
      package_name: "r-scworkflow"
      r_version: "4.1.3"
      artifact_rid_production: "ri.artifacts.main.repository.f36ea39e-b396-46cd-a04a-3c63250273f5"
      artifact_rid_development: "ri.stemma.main.repository.2172e505-c98f-43d4-881a-47e170aadbe1"
    secrets:
      NIDAP_TOKEN_PRODUCTION: ${{ secrets.NIDAP_TOKEN_PRODUCTION }}
      NIDAP_TOKEN_DEVELOPMENT: ${{ secrets.NIDAP_TOKEN_DEVELOPMENT }}
